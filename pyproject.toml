[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "oryksa"
version = "1.0.0"
description = "Official Python SDK for ORYKSA AI Employees: chat with the business's AI employee, attachments, your own AI tasks with ai(), sessions for apps and webhooks."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Weslley Harakawa" }]
maintainers = [{ name = "ORYKSA AI Employees" }]
keywords = ["oryksa", "ai", "ai-agent", "ai-employee", "chatbot", "customer-support", "whatsapp", "sdk"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Framework :: AsyncIO",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Communications :: Chat",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.24,<1"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://oryksa.com"
Documentation = "https://developer.oryksa.com"
Repository = "https://github.com/oryksa/oryksa-python"
Changelog = "https://github.com/oryksa/oryksa-python/blob/main/CHANGELOG.md"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
oryksa = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
